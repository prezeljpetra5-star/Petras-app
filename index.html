<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EDE9E1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<title>Petra's budget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22114%22%20fill%3D%22%235F6B50%22%2F%3E%3Cg%20fill%3D%22%23EDE9E1%22%3E%3Crect%20x%3D%22126%22%20y%3D%22286%22%20width%3D%2234%22%20height%3D%22104%22%20rx%3D%2217%22%2F%3E%3Crect%20x%3D%22182%22%20y%3D%22222%22%20width%3D%2234%22%20height%3D%22168%22%20rx%3D%2217%22%2F%3E%3Crect%20x%3D%22238%22%20y%3D%22264%22%20width%3D%2234%22%20height%3D%22126%22%20rx%3D%2217%22%2F%3E%3Crect%20x%3D%22350%22%20y%3D%22196%22%20width%3D%2234%22%20height%3D%22194%22%20rx%3D%2217%22%2F%3E%3C%2Fg%3E%3Crect%20x%3D%22294%22%20y%3D%22150%22%20width%3D%2234%22%20height%3D%22240%22%20rx%3D%2217%22%20fill%3D%22%23B8862B%22%2F%3E%3Crect%20x%3D%22104%22%20y%3D%22126%22%20width%3D%22304%22%20height%3D%227%22%20rx%3D%223.5%22%20fill%3D%22%23EDE9E1%22%20opacity%3D%22.45%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="ikona.png">
<style>
:root{
  --bg:#EDE9E1; --surface:#F6F3ED; --surface2:#E4DFD4; --line:#D5CEC0;
  --text:#35322B; --muted:#6F6858; --mint:#5F6B50; --amber:#B8862B; --red:#A6392A;
  --near:#B8862B;
  --bar-bg:#DDD6C8; --zero:#BDB4A3; --chip-text:#4A463C; --label:#7A7263;
  --subtle:#4E4A40; --press:#E2DCD0; --on-accent:#F6F3ED; --accent-press:#4E5842;
  --ok:#5F6B50; --ok-bg:#E3E7DC; --ok-line:#A8B599;
  --warn-bg:#F1E7D3; --warn-line:#D3BE92; --warn-text:#7A5F23;
  --f-ui:-apple-system,"Segoe UI",Roboto,"Samsung One",system-ui,sans-serif;
  --f-fig:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-num:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;padding-top:var(--safe-t)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--mint);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

#app{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 32px}

/* ---------- glava ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 12px;gap:10px}
.topbar h1{margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--label)}
.monthnav{display:flex;align-items:center;gap:0}
.monthnav button{width:30px;height:30px;color:var(--muted);font-size:15px;line-height:1;
  border-radius:50%}
.monthnav button:active{background:var(--press)}
.monthnav .lbl{padding:0 4px;font-size:13px;font-weight:600;min-width:96px;
  text-align:center;letter-spacing:.01em}

/* ---------- vnos ---------- */
.entryhead{padding:4px 20px 14px}
.chips{display:flex;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;
  transition:border-color .15s}
.chip:active{background:var(--surface)}
.chip strong{color:var(--subtle);font-weight:600}
.amount{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:2px 0}
.amount .val{font-family:var(--f-fig);font-size:68px;font-weight:400;line-height:.95;
  letter-spacing:-.02em;font-variant-numeric:lining-nums}
.amount .val.zero{color:var(--zero)}
.amount .cur{font-family:var(--f-fig);font-size:28px;color:var(--muted)}
.picked{text-align:center;font-size:12px;color:var(--muted);min-height:18px;
  padding-top:10px;letter-spacing:.04em}
.picked b{color:var(--mint);font-weight:600;letter-spacing:0}

.catwrap{flex:1;min-height:0;overflow-y:auto;padding:0 20px 12px;-webkit-overflow-scrolling:touch}
.grouplbl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);
  margin:20px 0 9px;font-weight:700}
.grouplbl:first-child{margin-top:4px}
.grouprow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:15px 0;border-bottom:1px solid var(--line)}
.grouprow .car{color:var(--label);font-size:9px;flex:0 0 8px;transition:transform .2s}
.grouprow[aria-expanded="true"] .car{transform:rotate(90deg)}
.grouprow .gnm{flex:1;font-size:15px;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grouprow .gn{font-size:11px;color:var(--label);font-family:var(--f-num)}
.grouprow .gsel{font-size:12px;color:var(--mint);font-weight:650;max-width:46%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grouprow.has .gnm{color:var(--subtle)}
.catgrid{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;
  color:var(--chip-text);max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;transition:background .12s,border-color .12s}
.cat:active{background:var(--surface)}
.cat.sel{background:var(--mint);border-color:var(--mint);color:var(--on-accent);font-weight:600}

/* ---------- tipkovnica ---------- */
.pad{padding:12px 16px calc(12px + var(--safe-b));
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:56px;border-radius:16px;font-size:22px;font-weight:400;
  font-family:var(--f-ui);color:var(--text);
  display:flex;align-items:center;justify-content:center;transition:background .1s}
.key:active{background:var(--press)}
.key.wide{grid-column:span 3;background:var(--mint);color:var(--on-accent);
  font-size:15px;font-weight:650;letter-spacing:.04em;height:52px;border-radius:14px;
  margin-top:4px}
.key.wide:disabled{background:transparent;color:var(--zero);
  box-shadow:inset 0 0 0 1px var(--line)}
.key.wide:active:enabled{background:var(--accent-press)}

/* ---------- razdelki ---------- */
.card{padding:0;margin-top:26px}
.sechead{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);
  font-weight:700;margin:30px 0 10px}

/* hero */
.hero{padding-top:6px}
.hero .row1{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.hero .spent{font-family:var(--f-fig);font-size:54px;line-height:1;letter-spacing:-.02em}
.hero .of{font-size:12.5px;color:var(--muted);margin-top:10px;letter-spacing:.02em}
.hero .of b{color:var(--subtle);font-weight:600}
.hero .left{display:none}

/* glavnik meseca */
.comb{display:flex;align-items:flex-end;gap:2.5px;height:64px;margin:22px 0 0}
.comb i{flex:1;background:var(--ok);border-radius:2px;min-height:3px;
  transform-origin:bottom;animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.comb i.over{background:var(--red)}
.comb i.none{background:var(--bar-bg)}
.comb i.fut{background:var(--bar-bg);opacity:.5}
.comb i.today{background:var(--mint)}
@keyframes rise{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.combleg{display:flex;justify-content:space-between;margin-top:8px;
  font-size:10px;color:var(--label);letter-spacing:.1em;text-transform:uppercase}

.bar{position:relative;height:8px;background:var(--bar-bg);border-radius:99px;overflow:hidden}
.bar .tick{position:absolute;top:0;bottom:0;width:2.5px;border-radius:2px;
  background:var(--bg);box-shadow:0 0 0 .5px var(--muted);z-index:2}
.bar>i.pastplan{background-image:repeating-linear-gradient(115deg,
  rgba(255,255,255,.45) 0 4px,transparent 4px 9px)}
.over-amt{color:var(--red);font-weight:650}
.comb i.over{background:var(--red);
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.45) 0 2.5px,transparent 2.5px 6px)}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .4s ease}
.pace{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.7}
.paceleg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
  margin-top:10px;gap:10px}

/* skupine */
.grp{border-top:1px solid var(--line);padding:14px 0 4px}
.grp:first-of-type{border-top:0}
.grow{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;padding-bottom:12px}
.grow .nm{flex:1;font-size:15px;font-weight:500;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.grow .amt{font-size:12.5px;color:var(--muted);white-space:nowrap;font-family:var(--f-num)}
.grow .amt b{color:var(--text);font-weight:500}
.grow .car{color:var(--label);font-size:9px;transition:transform .2s;flex:0 0 8px}
.grow[aria-expanded="true"] .car{transform:rotate(90deg)}
.subs{display:none;padding:8px 0 4px}
.subs.open{display:block}
.sub{display:flex;align-items:center;gap:14px;padding:9px 0}
.sub .nm{flex:1;font-size:13px;color:var(--subtle);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.sub .bar{width:64px;height:7px;flex:0 0 64px}
.sub .amt{font-size:11.5px;color:var(--muted);white-space:nowrap;font-family:var(--f-num)}

/* trend */
.trend{display:flex;align-items:center;gap:14px;width:100%;padding:9px 0;text-align:left}
.trend .m{font-size:11px;color:var(--muted);flex:0 0 46px;letter-spacing:.06em;
  text-transform:uppercase}
.trend.cur .m{color:var(--mint);font-weight:700}
.trend .bar{flex:1;height:8px}
.trend .v{font-size:11.5px;color:var(--subtle);flex:0 0 76px;text-align:right;
  font-family:var(--f-num)}

/* ---------- zgodovina: trak z računa ---------- */
.searchwrap{position:relative;padding:0 20px 12px}
.searchwrap input{width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:12px;padding:11px 38px 11px 14px;font-size:14px}
.searchwrap input::placeholder{color:var(--label)}
.searchwrap input:focus{outline:0;border-color:var(--mint)}
.searchwrap button{position:absolute;right:26px;top:50%;transform:translateY(-56%);
  width:28px;height:28px;color:var(--label);font-size:13px;display:none;border-radius:50%}
.searchwrap.has button{display:block}
.found{font-size:11px;color:var(--label);letter-spacing:.1em;text-transform:uppercase;
  padding:2px 0 4px}
.found b{color:var(--subtle);font-weight:700}
.heroline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:6px 0;border-bottom:1px solid var(--line)}
.heroline.second{border-bottom:0}
.heroline .hl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--label);font-weight:700}
.heroline .spent2{font-family:var(--f-fig);font-size:32px;line-height:1;letter-spacing:-.02em}
.fold{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:2px 0 10px}
.fold[aria-expanded="true"] .car{transform:rotate(90deg)}
.fold .car{color:var(--label);font-size:9px;transition:transform .2s;flex:0 0 8px}
.fold .sechead{flex:1}
.fold .foldv{font-size:11.5px;color:var(--muted)}
.notechips{margin:14px 0 0;justify-content:center}
.dbig{font-family:var(--f-fig);font-size:46px;line-height:1;letter-spacing:-.02em}
.dsum{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;
  border-bottom:1px solid var(--line)}
.dsum:last-child{border-bottom:0}
.dsum .k{font-size:13px;color:var(--subtle)}
.dsum .v{font-family:var(--f-num);font-size:13.5px}
.drow{display:flex;align-items:center;gap:10px;padding:12px 0;
  border-bottom:1px solid var(--line);width:100%;text-align:left}
.drow:last-child{border-bottom:0}
.drow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .nm small{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--f-num)}
.drow .v{font-family:var(--f-num);font-size:14px;white-space:nowrap;font-weight:650}
.drow .v.up{color:var(--red)}
.drow .v.down{color:var(--ok)}
.day{margin-top:26px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 0 4px;font-size:10px;color:var(--label);letter-spacing:.12em;
  text-transform:uppercase;border-bottom:1px solid var(--line)}
.dayhead b{color:var(--subtle);font-weight:700;font-size:10px;letter-spacing:.12em}
.ent{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--line)}
.ent:active{background:var(--surface)}
.ent .dot{display:none}
.ent .t{flex:1;min-width:0}
.ent .t .c{font-size:14.5px;font-weight:450;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;letter-spacing:-.01em}
.ent .t .n{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-style:italic}
.ent .a{font-size:14px;white-space:nowrap;font-family:var(--f-num);color:var(--subtle)}

/* ---------- plan ---------- */
.planrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.planrow:last-child{border-bottom:0}
.planrow .nm{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:left;letter-spacing:-.01em}
.planrow input{width:88px;background:transparent;border:0;border-bottom:1px solid var(--line);
  border-radius:0;padding:6px 2px;text-align:right;font-family:var(--f-num);font-size:14px}
.planrow input:focus{outline:0;border-bottom-color:var(--mint)}
.planrow .del{color:var(--label);font-size:15px;padding:6px 0 6px 8px}

.btn{display:block;width:100%;border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:14px;font-weight:600;margin-top:10px;text-align:center;
  letter-spacing:.02em;transition:background .12s}
.btn:active{background:var(--press)}
.btn.primary{background:var(--mint);color:var(--on-accent);border-color:var(--mint)}
.btn.danger{color:var(--red);border-color:transparent}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0 0}
.hint b{color:var(--subtle);font-weight:600}

/* ---------- zavihki ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tab{padding:11px 0 10px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--label);font-size:8.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;transition:color .15s}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--mint)}

/* ---------- listi ---------- */
.mask{position:fixed;inset:0;background:rgba(53,50,43,.42);display:none;z-index:40;
  align-items:flex-end;backdrop-filter:blur(3px)}
.mask.on{display:flex}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;
  padding:24px 20px calc(24px + var(--safe-b));max-height:88vh;overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.8,.3,1);border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 18px;font-family:var(--f-fig);font-size:24px;font-weight:400;
  letter-spacing:-.01em}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:9.5px;color:var(--label);text-transform:uppercase;
  letter-spacing:.16em;margin-bottom:7px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surface2);
  border:1px solid var(--line);border-radius:12px;padding:13px}
.fld textarea{min-height:70px;resize:vertical}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,12px);
  background:var(--mint);color:var(--on-accent);padding:11px 22px;border-radius:999px;
  font-size:13px;font-weight:650;letter-spacing:.02em;opacity:0;pointer-events:none;
  transition:.24s cubic-bezier(.2,.8,.3,1);z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:56px 20px;line-height:1.7}
.empty b{color:var(--subtle)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <section class="screen on" id="s-add">
    <div class="entryhead">
      <div class="chips">
        <button class="chip" id="dateChip">📅 <strong id="dateLbl">danes</strong></button>
      </div>
      <div class="amount"><span class="val num zero" id="amtVal">0</span><span class="cur">€</span></div>
      <div class="picked" id="pickedLbl">Izberi kategorijo</div>
      <div class="chips notechips">
        <button class="chip" id="noteChip">📝 <strong id="noteLbl">Dodaj komentar</strong></button>
      </div>
    </div>
    <div class="catwrap" id="catWrap"></div>
    <div class="pad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key" data-k=",">,</button><button class="key" data-k="0">0</button><button class="key" data-k="del">⌫</button>
      <button class="key wide" id="saveBtn" disabled>Shrani</button>
    </div>
  </section>

  <section class="screen" id="s-over">
    <div class="topbar">
      <h1>Pregled</h1>
      <div class="monthnav"><button data-m="-1">‹</button><span class="lbl" id="mLbl1"></span><button data-m="1">›</button></div>
    </div>
    <div class="scroll" id="overBody"></div>
  </section>

  <section class="screen" id="s-hist">
    <div class="topbar">
      <h1>Zgodovina</h1>
      <div class="monthnav"><button data-m="-1">‹</button><span class="lbl" id="mLbl2"></span><button data-m="1">›</button></div>
    </div>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="Poišči po komentarju ali kategoriji" autocomplete="off">
      <button id="qx" aria-label="Počisti iskanje">✕</button>
    </div>
    <div class="scroll" id="histBody"></div>
  </section>

  <section class="screen" id="s-diff">
    <div class="topbar">
      <h1>Razlika</h1>
      <div class="monthnav"><button data-m="-1">‹</button><span class="lbl" id="mLbl3"></span><button data-m="1">›</button></div>
    </div>
    <div class="scroll" id="diffBody"></div>
  </section>

  <section class="screen" id="s-plan">
    <div class="topbar"><h1>Plan in nastavitve</h1></div>
    <div class="scroll" id="planBody"></div>
  </section>

  <nav class="tabs">
    <button class="tab on" data-s="s-add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Vnos</button>
    <button class="tab" data-s="s-over"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Pregled</button>
    <button class="tab" data-s="s-hist"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Zgodovina</button>
    <button class="tab" data-s="s-diff">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h11M3 18h7"/><path d="M20 15l2 3h-4z"/></svg>Razlika</button>
    <button class="tab" data-s="s-plan"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Plan</button>
  </nav>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="date" id="dateInput" style="position:fixed;opacity:0;pointer-events:none;left:16px;bottom:80px">

<script>
"use strict";
/* podatki uvoženi iz STROŠKI.xlsx */
const SEED={"cats":[{"g":"Trgovina – hrana","n":"Doma hrana","p":75},{"g":"Trgovina – hrana","n":"Služba hrana","p":75},{"g":"Trgovina – hrana","n":"Wolt + restavracija","p":30},{"g":"Trgovina ostalo","n":"Kozmetika","p":20},{"g":"Trgovina ostalo","n":"Zdravila","p":0},{"g":"Trgovina ostalo","n":"Čistila","p":0},{"g":"Trgovina ostalo","n":"Oblačila","p":0},{"g":"Trgovina ostalo","n":"Ostalo","p":0},{"g":"Vadba","n":"Zen Vital Reformer + fitnes","p":0},{"g":"Terapije","n":"Tjaša","p":0},{"g":"Terapije","n":"Ostalo","p":0},{"g":"Zdravstvo","n":"Dermatolog","p":0},{"g":"Zdravstvo","n":"Zobar","p":0},{"g":"Avto","n":"Gorivo","p":100},{"g":"Avto","n":"Popravila","p":0},{"g":"Avto","n":"Registracija in ostalo","p":0},{"g":"Stanovanje","n":"Najemnina","p":385},{"g":"Stanovanje","n":"Stroški","p":100},{"g":"Potovanja / izleti","n":"Potovanje","p":0},{"g":"Potovanja / izleti","n":"Izlet","p":0},{"g":"Ostali stroški","n":"Telefon","p":0},{"g":"Ostali stroški","n":"Stroški banka","p":7},{"g":"Druženja","n":"Prijatelji / družina","p":50},{"g":"Druženja","n":"Žiga","p":100},{"g":"Druženja","n":"Darila","p":0},{"g":"Ostalo","n":"Ostalo","p":50},{"g":"Ostalo","n":"Magistrska naloga","p":0},{"g":"Ostalo","n":"s.p.","p":0}],"entries":[]};

const KEY="stroski-v2";
const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY,false); return r&&r.value?JSON.parse(r.value):null;} }catch(e){}
    try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(d){
    const s=JSON.stringify(d);
    try{ if(window.storage){ await window.storage.set(KEY,s,false); } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};
function seed(){
  const cats=SEED.cats.map((c,i)=>({id:"c"+String(i).padStart(2,"0"),group:c.g,name:c.n,plan:c.p}));
  const entries=SEED.entries.map((e,i)=>({id:"i"+i,date:e.d,cat:e.c,amt:e.a,note:e.n||""}));
  return {v:2,cats,entries};
}

let D={v:2,cats:[],entries:[]};
let month=ym(new Date());
let draft={amt:"",cat:null,date:today(),note:""};
let openGroups={};
let openTrend=false;
let openCat=null;

function today(){const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function p2(n){return String(n).padStart(2,"0");}
function ym(d){return d.getFullYear()+"-"+p2(d.getMonth()+1);}
const MONTHS=["Januar","Februar","Marec","April","Maj","Junij","Julij","Avgust","September","Oktober","November","December"];
const SHORT=["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
const DAYS=["Nedelja","Ponedeljek","Torek","Sreda","Četrtek","Petek","Sobota"];
function monthLbl(m){const[y,mo]=m.split("-");return MONTHS[+mo-1]+" "+y;}
function eur(n){const s=Math.abs(n).toFixed(2).split(".");
  return (n<0?"−":"")+s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+s[1]+" €";}
function eur0(n){return Math.round(n).toLocaleString("de-DE")+" €";}
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

function save(){D.savedAt=new Date().toISOString();store.set(D);}
function groups(){const g=[];D.cats.forEach(c=>{if(!g.includes(c.group))g.push(c.group)});return g;}
function catById(id){return D.cats.find(c=>c.id===id);}
function monthEntries(m){return D.entries.filter(e=>e.date.slice(0,7)===m);}
function spentBy(m){const o={};monthEntries(m).forEach(e=>{o[e.cat]=(o[e.cat]||0)+e.amt});return o;}
function planTotal(){return D.cats.reduce((s,c)=>s+(c.hidden?0:(+c.plan||0)),0);}
function barHTML(sp,pl){
  if(!pl)return sp>0
    ? '<i class="pastplan" style="width:100%;background:var(--red)"></i>'
    : '<i style="width:0%"></i>';
  const maxv=Math.max(pl,sp);
  const fill=Math.min(100,sp/maxv*100);
  const tick=pl/maxv*100;
  const cez=sp>pl;
  const col=cez?"var(--red)":(sp/pl>=.8?"var(--near)":"var(--ok)");
  return '<i class="'+(cez?"pastplan":"")+'" style="width:'+fill.toFixed(1)+'%;background:'+col+'"></i>'+
         '<span class="tick" style="left:'+tick.toFixed(1)+'%"></span>';
}
function cezTxt(sp,pl){return (pl&&sp>pl)?' <span class="over-amt">+'+eur(sp-pl)+'</span>':'';}
function barColor(sp,pl){if(!pl)return sp>0?"#5E7175":"var(--line)";
  const r=sp/pl; return r>=1?"var(--red)":r>=.8?"var(--amber)":"var(--mint)";}

/* ---------- VNOS ---------- */
function renderCats(){
  const w=$("#catWrap");w.innerHTML="";
  const izbrana=draft.cat?catById(draft.cat):null;
  groups().forEach(g=>{
    const vidne=D.cats.filter(c=>c.group===g&&!c.hidden);
    if(!vidne.length)return;
    const odprta=(openCat===g);
    const imaIzbrano=izbrana&&izbrana.group===g;

    const row=el("button","grouprow"+(imaIzbrano?" has":""));
    row.setAttribute("aria-expanded",odprta);
    row.innerHTML='<span class="car">▶</span>'+
      '<span class="gnm">'+esc(g)+'</span>'+
      (imaIzbrano?'<span class="gsel">'+esc(izbrana.name)+'</span>'
                 :'<span class="gn">'+vidne.length+'</span>');
    row.onclick=()=>{openCat=odprta?null:g;renderCats();};
    w.appendChild(row);

    if(odprta){
      const grid=el("div","catgrid");
      grid.style.margin="2px 0 12px";
      vidne.forEach(c=>{
        const b=el("button","cat"+(draft.cat===c.id?" sel":""),c.name);
        b.onclick=()=>{draft.cat=c.id;renderCats();paintDraft();};
        grid.appendChild(b);
      });
      w.appendChild(grid);
    }
  });
}
function paintDraft(){
  const v=$("#amtVal");
  v.textContent=draft.amt===""?"0":draft.amt;
  v.classList.toggle("zero",draft.amt===""||parseFloat(draft.amt.replace(",","."))===0);
  const c=draft.cat?catById(draft.cat):null;
  $("#pickedLbl").innerHTML=c?"<b>"+esc(c.name)+"</b> · "+esc(c.group):"Izberi kategorijo";
  $("#dateLbl").textContent=draft.date===today()?"danes":draft.date.split("-").reverse().slice(0,2).join(".")+".";
  $("#noteLbl").textContent=draft.note?(draft.note.length>22?draft.note.slice(0,22)+"…":draft.note):"Dodaj komentar";
  $("#saveBtn").disabled=!(c&&parseFloat(draft.amt.replace(",","."))>0);
}
function press(k){
  if(k==="del"){draft.amt=draft.amt.slice(0,-1);}
  else if(k===","){ if(!draft.amt.includes(","))draft.amt=(draft.amt||"0")+","; }
  else{
    const d=draft.amt.split(",");
    if(d[1]&&d[1].length>=2)return;
    if(!d[1]&&draft.amt.replace(",","").length>=6)return;
    draft.amt=(draft.amt==="0"?"":draft.amt)+k;
  }
  paintDraft();
}
document.querySelectorAll(".key[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
$("#saveBtn").onclick=()=>{
  const a=parseFloat(draft.amt.replace(",","."));
  if(!(a>0)||!draft.cat)return;
  D.entries.push({id:"n"+Date.now(),date:draft.date,cat:draft.cat,amt:a,note:draft.note.trim()});
  save();toast("Shranjeno · "+eur(a));
  if(navigator.vibrate)navigator.vibrate(14);
  draft={amt:"",cat:draft.cat,date:draft.date,note:""};
  paintDraft();renderOver();renderHist();
};
$("#dateChip").onclick=()=>{const i=$("#dateInput");i.value=draft.date;i.showPicker?i.showPicker():i.click();};
$("#dateInput").onchange=e=>{if(e.target.value){draft.date=e.target.value;paintDraft();}};
$("#noteChip").onclick=()=>{
  const zadnji=[];
  D.entries.slice().reverse().forEach(e=>{
    if(e.note&&zadnji.indexOf(e.note)<0&&zadnji.length<6)zadnji.push(e.note);
  });
  const chips=zadnji.length
    ? '<div class="fld"><label>Nazadnje uporabljeno</label><div class="catgrid" id="nz">'+
      zadnji.map((n,i)=>'<button class="cat" data-i="'+i+'">'+esc(n)+'</button>').join("")+'</div></div>'
    : '';
  openSheet("Komentar",
    '<div class="fld"><textarea id="nt" placeholder="npr. Kosilo z Žigom, parking">'+esc(draft.note)+'</textarea></div>'+
    chips+
    '<button class="btn primary" id="ok">Shrani komentar</button>'+
    (draft.note?'<button class="btn" id="clr">Odstrani komentar</button>':''),()=>{
    $("#ok").onclick=()=>{draft.note=$("#nt").value;closeSheet();paintDraft();};
    const c=$("#clr");
    if(c)c.onclick=()=>{draft.note="";closeSheet();paintDraft();};
    if(zadnji.length){
      document.querySelectorAll("#nz .cat").forEach(bt=>{
        bt.onclick=()=>{draft.note=zadnji[+bt.dataset.i];closeSheet();paintDraft();};
      });
    }
    setTimeout(()=>$("#nt").focus(),80);
  });
};

/* ---------- PREGLED ---------- */
function renderOver(){
  $("#mLbl1").textContent=monthLbl(month);
  $("#mLbl2").textContent=monthLbl(month);
  const body=$("#overBody");body.innerHTML="";

  /* ob prvem odprtju: ponudi obnovitev iz kopije */
  if(!D.entries.length){
    const w=el("div","card");
    w.style.cssText="background:var(--ok-bg);border:1px solid var(--ok-line)";
    w.innerHTML='<div style="font-size:15px;font-weight:650;margin-bottom:6px">Dobrodošla 👋</div>'+
      '<div class="hint" style="margin:0 0 12px">Aplikacija je še prazna. Če imaš datoteko <b>stroski-podatki.json</b>, '+
      'jo naloži in dobiš nazaj vseh 546 vnosov iz preglednice. Sicer kar začni vnašati.</div>';
    const rb=el("button","btn primary","Naloži varnostno kopijo");
    rb.style.marginTop="0";
    rb.onclick=backupRestore;
    w.appendChild(rb);
    body.appendChild(w);
  }

  const sp=spentBy(month), plan=planTotal();
  const spent=Object.values(sp).reduce((a,b)=>a+b,0);
  const left=plan-spent;
  const [y,mo]=month.split("-").map(Number);
  const dim=new Date(y,mo,0).getDate();
  const isNow=month===ym(new Date());
  const dayNow=isNow?new Date().getDate():dim;
  const daysLeft=isNow?Math.max(0,dim-dayNow+1):0;
  const pace=dayNow/dim;

  const hero=el("div","card hero");
  let h='<div class="heroline"><span class="hl">Porabljeno</span>'+
      '<span class="spent">'+eur(spent)+'</span></div>'+
    '<div class="heroline second"><span class="hl">'+(left<0?"Čez plan":"Ostane")+'</span>'+
      '<span class="spent2'+(left<0?" over-amt":"")+'">'+eur(Math.abs(left))+'</span></div>';

  /* glavnik meseca: en stolpič na dan, višina = poraba tistega dne */
  const dnevi=[];
  for(let i=1;i<=dim;i++)dnevi.push(0);
  monthEntries(month).forEach(e=>{dnevi[+e.date.slice(8,10)-1]+=e.amt;});
  const najv=Math.max.apply(null,dnevi.concat([1]));
  const dovoljeno=plan/dim;
  h+='<div class="comb">';
  dnevi.forEach((v,i)=>{
    const d=i+1;
    let cls="",vis;
    if(isNow&&d>dayNow){cls="fut";vis=14;}
    else if(!v){cls="none";vis=3;}
    else{cls=v>dovoljeno?"over":"";vis=Math.max(6,Math.round(v/najv*100));}
    if(isNow&&d===dayNow&&v)cls="today";
    h+='<i class="'+cls+'" style="height:'+vis+'%;animation-delay:'+(i*11)+'ms"></i>';
  });
  h+='</div><div class="combleg"><span>1.</span><span>'+
    (isNow?dayNow+". · danes":"poraba po dnevih")+'</span><span>'+dim+'.</span></div>';
  h+='<div class="paceleg"><span>'+monthEntries(month).length+' vnosov</span><span>'+
    (isNow&&daysLeft>0
      ? "še "+daysLeft+" dni · "+eur(Math.max(0,left)/daysLeft)+"/dan"
      : eur(spent/dim)+"/dan povprečno")+'</span></div>';
  hero.innerHTML=h;
  body.appendChild(hero);

  const gc=el("div","card");
  const gs=groups().filter(g=>D.cats.filter(c=>c.group===g).some(c=>(sp[c.id]||0)>0||(!c.hidden&&+c.plan>0)));
  if(!gs.length)gc.innerHTML='<div class="empty">Ta mesec še ni vnosov.<br>Odpri <b>Vnos</b> in zabeleži prvi strošek.</div>';
  gs.forEach(g=>{
    const cs=D.cats.filter(c=>c.group===g);
    const gsp=cs.reduce((s,c)=>s+(sp[c.id]||0),0);
    const gpl=cs.reduce((s,c)=>s+(c.hidden?0:(+c.plan||0)),0);
    const box=el("div","grp");
    const btn=el("button","grow");
    btn.setAttribute("aria-expanded",!!openGroups[g]);
    btn.innerHTML='<span class="car">▶</span><span class="nm">'+esc(g)+'</span>'+
      '<span class="amt num"><b>'+eur(gsp)+'</b>'+
      (gpl?' / '+eur(gpl):' <span class="over-amt">/ '+eur(0)+'</span>')+'</span>';
    const bar=el("div","bar");
    bar.innerHTML=barHTML(gsp,gpl);
    const subs=el("div","subs"+(openGroups[g]?" open":""));
    cs.forEach(c=>{
      const s=sp[c.id]||0,pl=c.hidden?0:(+c.plan||0);
      if(!s&&!pl)return;
      const r=el("div","sub");
      r.innerHTML='<span class="nm">'+esc(c.name)+'</span>'+
        '<span class="bar">'+barHTML(s,pl)+'</span>'+
        '<span class="amt">'+eur(s)+
        (pl?' / '+eur(pl):' <span class="over-amt">/ '+eur(0)+'</span>')+'</span>';
      subs.appendChild(r);
    });
    btn.onclick=()=>{openGroups[g]=!openGroups[g];renderOver();};
    box.appendChild(btn);box.appendChild(bar);box.appendChild(subs);
    gc.appendChild(box);
  });
  body.appendChild(gc);

  const top=Object.entries(sp).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(top.length){
    const t=el("div","card");
    t.innerHTML='<div class="sechead" style="margin:0 0 8px">Največ ta mesec</div>'+
      top.map(x=>{const c=catById(x[0]);return '<div class="sub"><span class="nm">'+esc(c?c.name:"?")+'</span><span class="amt">'+eur(x[1])+'</span></div>';}).join("");
    body.appendChild(t);
  }

  /* mesečni trend */
  const byM={};
  D.entries.forEach(e=>{const k=e.date.slice(0,7);byM[k]=(byM[k]||0)+e.amt;});
  const keys=Object.keys(byM).sort();
  if(keys.length>1){
    const od=D.trendFrom||"2025-12";
    const show=keys.filter(k=>k>=od).slice(-12);
    if(!show.length)return;
    const avg=show.reduce((s,k)=>s+byM[k],0)/show.length;
    const t=el("div","card");
    const th=el("button","fold");
    th.setAttribute("aria-expanded",!!openTrend);
    th.innerHTML='<span class="car">▶</span><span class="sechead" style="margin:0">Po mesecih</span>'+
      '<span class="foldv num">'+eur(avg)+' povprečno</span>';
    th.onclick=()=>{openTrend=!openTrend;renderOver();};
    t.appendChild(th);
    const tb=el("div","subs"+(openTrend?" open":""));
    show.forEach(k=>{
      const [yy,mm]=k.split("-");
      const b=el("button","trend"+(k===month?" cur":""));
      b.innerHTML='<span class="m">'+SHORT[+mm-1]+" "+yy.slice(2)+'</span>'+
        '<span class="bar">'+barHTML(byM[k],planTotal())+'</span>'+
        '<span class="v">'+eur(byM[k])+'</span>';
      b.onclick=()=>{month=k;renderOver();renderHist();renderDiff();};
      tb.appendChild(b);
    });
    const f=el("div","hint");
    f.innerHTML="Povprečje zadnjih "+show.length+" mesecev. Meseci brez podatkov niso prikazani.";
    tb.appendChild(f);
    t.appendChild(tb);
    body.appendChild(t);
  }
  /* opomnik za varnostno kopijo */
  const dni=D.backupAt?Math.floor((Date.now()-new Date(D.backupAt))/864e5):null;
  if(D.entries.length&&(dni===null||dni>=14)){
    const rem=el("div","card");
    rem.style.cssText="background:var(--warn-bg);border:1px solid var(--warn-line)";
    rem.innerHTML='<div class="hint" style="margin:0 0 10px;color:var(--warn-text)">'+
      (dni===null?"Varnostne kopije \u0161e nisi naredila.":"Zadnja varnostna kopija je stara "+dni+" dni.")+
      ' \u010ce telefon izgubi podatke brskalnika, gre vse. Kopija traja pet sekund.</div>';
    const rb=el("button","btn","Shrani varnostno kopijo");
    rb.style.marginTop="0";
    rb.onclick=backupSave;
    rem.appendChild(rb);
    body.appendChild(rem);
  }

  /* stanje shranjevanja \u2014 da se takoj vidi, ali telefon podatke obdr\u017ei */
  const st=el("div","card");
  st.style.cssText="background:transparent;padding:4px 2px 0;margin-top:14px";
  let txt;
  if(D.savedAt){
    const d=new Date(D.savedAt);
    txt="Zadnjič shranjeno: <b>"+d.getDate()+". "+MONTHS[d.getMonth()].toLowerCase()+" ob "+
      p2(d.getHours())+":"+p2(d.getMinutes())+"</b>";
  }else{
    txt="Zadnjič shranjeno: <b>še nikoli</b>";
  }
  st.innerHTML='<div class="hint" style="margin:0;text-align:center">'+txt+
    '<br>Če se ta čas po ponovnem odprtju ne spremeni, telefon vnosov ne shranjuje.</div>';
  body.appendChild(st);
}
function renderDiff(){
  const l=$("#mLbl3");if(l)l.textContent=monthLbl(month);
  const b=$("#diffBody");if(!b)return;b.innerHTML="";
  const sp=spentBy(month), plan=planTotal();
  const spent=Object.values(sp).reduce((a,x)=>a+x,0);
  const raz=plan-spent;

  const head=el("div","card");head.style.marginTop="4px";
  head.innerHTML='<div class="dbig" style="color:'+(raz<0?"var(--red)":"var(--ok)")+'">'+
      (raz<0?"+"+eur(-raz):eur(raz))+'</div>'+
    '<div class="hint" style="margin-top:6px">'+
      (raz<0?"toliko si čez mesečni plan":"toliko ti ostane do plana")+'</div>'+
    '<div style="margin-top:18px">'+
      '<div class="dsum"><span class="k">Plan</span><span class="v">'+eur(plan)+'</span></div>'+
      '<div class="dsum"><span class="k">Porabljeno</span><span class="v">'+eur(spent)+'</span></div>'+
    '</div>';
  b.appendChild(head);

  const cez=[],znotraj=[],brez=[];
  D.cats.forEach(c=>{
    const v=sp[c.id]||0, pl=c.hidden?0:(+c.plan||0);
    if(pl>0&&v>pl)cez.push([c,v,pl]);
    else if(pl>0)znotraj.push([c,v,pl]);
    else if(v>0)brez.push([c,v,0]);
  });
  cez.sort((a,x)=>(x[1]-x[2])-(a[1]-a[2]));
  znotraj.sort((a,x)=>(a[2]-a[1])-(x[2]-x[1]));
  brez.sort((a,x)=>x[1]-a[1]);

  function odsek(naslov,seznam,tip,pojasnilo){
    if(!seznam.length)return;
    b.appendChild(el("div","sechead",naslov));
    const box=el("div","card");box.style.marginTop="4px";
    seznam.forEach(r=>{
      const c=r[0],v=r[1],pl=r[2];
      const row=el("button","drow");
      let val,cls;
      if(tip==="cez"){val="+"+eur(v-pl);cls="up";}
      else if(tip==="znotraj"){val=eur(pl-v);cls="down";}
      else{val="+"+eur(v);cls="up";}
      row.innerHTML='<span class="nm">'+esc(c.name)+
        '<small>'+eur(v)+' / '+eur(pl)+'</small></span>'+
        '<span class="v '+cls+'">'+val+'</span>';
      row.onclick=()=>{
        document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.s==="s-hist"));
        document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("on",x.id==="s-hist"));
        const q=$("#q");if(q)q.value=c.name;

function renderHist(){
  const b=$("#histBody");b.innerHTML="";
  const qEl=$("#q");
  const q=(qEl?qEl.value:"").trim().toLowerCase();
  const wrap=document.querySelector(".searchwrap");
  if(wrap)wrap.classList.toggle("has",!!q);

  /* brez iskanja: tekoči mesec. Z iskanjem: vsi meseci. */
  let es;
  if(q){
    es=D.entries.filter(e=>{
      const c=catById(e.cat);
      return (e.note||"").toLowerCase().indexOf(q)>=0 ||
             (c?(c.name+" "+c.group).toLowerCase().indexOf(q):-1)>=0;
    });
  }else{
    es=monthEntries(month);
  }
  es=es.slice().sort((x,y)=>y.date.localeCompare(x.date)||String(y.id).localeCompare(String(x.id)));

  if(!es.length){
    b.innerHTML=q
      ? '<div class="empty">Za <b>'+esc(q)+'</b> ni zadetkov.<br>Iskanje gre po komentarjih in imenih kategorij, po vseh mesecih.</div>'
      : '<div class="empty">Ni vnosov za '+monthLbl(month)+'.</div>';
    return;
  }
  if(q){
    const vs=es.reduce((a,e)=>a+e.amt,0);
    const f=el("div","found");
    f.innerHTML='<b>'+es.length+'</b> zadetkov · skupaj <b>'+eur(vs)+'</b> · vsi meseci';
    b.appendChild(f);
  }
  let cur=null,box=null;
  es.forEach(e=>{
    if(e.date!==cur){
      cur=e.date;
      const d=new Date(cur+"T12:00:00");
      const tot=es.filter(x=>x.date===cur).reduce((s,x)=>s+x.amt,0);
      box=el("div","day");
      const h=el("div","dayhead");
      h.innerHTML='<span><b>'+d.getDate()+". "+MONTHS[d.getMonth()].toLowerCase()+
        (q?" "+d.getFullYear():"")+'</b> · '+DAYS[d.getDay()].toLowerCase()+
        '</span><span class="num">'+eur(tot)+'</span>';
      box.appendChild(h);b.appendChild(box);
    }
    const c=catById(e.cat);
    const btn=el("button","ent");
    btn.innerHTML='<span class="t"><span class="c">'+esc(c?c.name:"—")+'</span>'+
      '<span class="n">'+esc(e.note||(c?c.group:""))+'</span></span>'+
      '<span class="a num">'+eur(e.amt)+'</span>';
    btn.onclick=()=>editEntry(e.id);
    box.appendChild(btn);
  });
}
function editEntry(id){
  const e=D.entries.find(x=>x.id===id);if(!e)return;
  const opts=groups().map(g=>'<optgroup label="'+esc(g)+'">'+
    D.cats.filter(c=>c.group===g).map(c=>'<option value="'+c.id+'"'+(c.id===e.cat?" selected":"")+'>'+esc(c.name)+'</option>').join("")+
    '</optgroup>').join("");
  openSheet("Uredi vnos",
    '<div class="fld"><label>Znesek (€)</label><input id="ea" type="text" inputmode="decimal" value="'+String(e.amt).replace(".",",")+'"></div>'+
    '<div class="fld"><label>Kategorija</label><select id="ec">'+opts+'</select></div>'+
    '<div class="fld"><label>Datum</label><input id="ed" type="date" value="'+e.date+'"></div>'+

    '<button class="btn primary" id="ok">Shrani spremembe</button>'+

function backupSave(){
  const blob=new Blob([JSON.stringify(D)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="stroski-kopija-"+today()+".json";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},400);
  D.backupAt=new Date().toISOString();save();
  renderOver();toast("Kopija shranjena");
}
function backupRestore(){
  const f=document.createElement("input");
  f.type="file";
  /* brez filtra: Androidov izbirnik pogosto skrije .json datoteke */
  f.onchange=()=>{
    const file=f.files&&f.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const o=JSON.parse(rd.result);
        if(!o||!Array.isArray(o.cats)||!Array.isArray(o.entries))throw 0;
        if(D.entries.length&&!confirm("Zamenja vse trenutne podatke s "+o.entries.length+" vnosi iz kopije. Nadaljujem?"))return;
        D=o;save();openGroups={};draft={amt:"",cat:null,date:today(),note:""};
        month=ym(new Date());
        renderAll();toast("Obnovljeno · "+o.entries.length+" vnosov");
      }catch(e){ toast("To ni datoteka s kopijo"); }
    };
    rd.onerror=()=>toast("Datoteke ni bilo mogoče prebrati");
    rd.readAsText(file);
  };
  f.click();
}

function dl(name,text){
  const b=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},400);
  toast("Izvoženo");
}
const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
function exportAll(){
  const rows=[["Datum","Skupina","Kategorija","Znesek","Komentar"]];
  D.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const c=catById(e.cat)||{group:"",name:""};
    rows.push([e.date,c.group,c.name,String(e.amt).replace(".",","),e.note||""]);
  });
  dl("stroski-vsi.csv",rows.map(r=>r.map(q).join(";")).join("\n"));
}
function exportMonth(){
  const es=monthEntries(month),cats=D.cats;
  const [y,mo]=month.split("-").map(Number);
  const dim=new Date(y,mo,0).getDate();
  const rows=[["Datum"].concat(cats.map(c=>c.name)).concat(["SKUPAJ","Komentar"])];
  for(let d=1;d<=dim;d++){
    const ds=y+"-"+p2(mo)+"-"+p2(d);
    const day=es.filter(e=>e.date===ds);
    const r=[ds.split("-").reverse().join(".")];
    let tot=0;
    cats.forEach(c=>{
      const v=day.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amt,0);
      tot+=v;r.push(v?v.toFixed(2).replace(".",","):"");
    });
    r.push(tot.toFixed(2).replace(".",","));
    r.push(day.map(e=>e.note).filter(Boolean).join(" · "));
    rows.push(r);
  }
  const sp=spentBy(month);
  const tot=Object.values(sp).reduce((a,b)=>a+b,0);
  rows.push([]);
  rows.push(["SKUPAJ"].concat(cats.map(c=>(sp[c.id]||0).toFixed(2).replace(".",","))).concat([tot.toFixed(2).replace(".",","),""]));
  rows.push(["Plan"].concat(cats.map(c=>String(c.plan||0).replace(".",","))).concat([String(planTotal()).replace(".",","),""]));
  rows.push(["Razlika"].concat(cats.map(c=>((+c.plan||0)-(sp[c.id]||0)).toFixed(2).replace(".",","))).concat([(planTotal()-tot).toFixed(2).replace(".",","),""]));
  dl("stroski-"+month+".csv",rows.map(r=>r.map(q).join(";")).join("\n"));
}

/* preveri, ali brskalnik sploh dovoli shranjevanje (pri file:// pogosto ne) */
function storageWorks(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return !!window.storage; }
}
function warnBanner(){
  const w=document.createElement("div");
  w.style.cssText="background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn-text);padding:11px 14px;font-size:12.5px;line-height:1.5";
  w.innerHTML="⚠️ <b>Ta brskalnik ne shranjuje podatkov.</b> Vnosi bodo izgubljeni, ko zapreš zavihek. "+
    "Odpri aplikacijo prek spletne povezave (https), ne kot datoteko iz map.";
  document.getElementById("app").prepend(w);
}

(async function init(){
  installBits();
  const saved=await store.get();
  D=(saved&&saved.cats&&saved.cats.length)?saved:seed();
  if(!D.theme)D.theme="lan";
  if(!THEMES[D.theme])D.theme="lan";
  if(!D.trendFrom)D.trendFrom="2025-12";
  applyTheme(D.theme);
  if(!saved)save();
  renderAll();
  if(!storageWorks())warnBanner();
})();
</script>
